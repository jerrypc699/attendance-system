services:
  postgres:
    image: imresamu/postgis:16-3.4
    container_name: attendance_postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-attendance_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data

  api:
    build: .
    container_name: attendance_api
    restart: always
    ports:
      - "127.0.0.1:8000:8000"
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-attendance_db}
      - ENVIRONMENT=production
    volumes:
      - ./uploads:/app/uploads
      - ./models:/app/models
    depends_on:
      - postgres

volumes:
  pgdata:
